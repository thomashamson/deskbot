</text><text class="terminal-133812030-r1" x="0" y="312.8" textLength="1024.8" clip-path="url(#terminal-133812030-line-12)">&#160;&#160;deposits&#160;spans&#160;Alluvium&#160;and&#160;Langley&#160;Silt&#160;Member.&#160;The&#160;site&#160;may&#160;sit&#160;on&#160;any&#160;of&#160;these.</text><text class="terminal-133812030-r1" x="1122.4" y="312.8" textLength="12.2" clip-path="url(#terminal-133812030-line-12)">
